name: Feature request
description: Propose a capability, API contract, platform behavior, or repository improvement.
title: "[Feature]: "
body:
  - type: markdown
    attributes:
      value: |
        Describe the user problem before proposing an implementation. KeyMouse
        distinguishes global listening, shortcut registration, selective
        interception, and event replacement.

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and pull requests.
          required: true
        - label: This request does not disclose a suspected security vulnerability.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user problem is not addressed by the current scope or behavior?
    validations:
      required: true

  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed solution
      description: Describe the behavior and contract, not only the implementation.
    validations:
      required: true

  - type: dropdown
    id: capability
    attributes:
      label: Capability layers
      multiple: true
      options:
        - Global listening
        - Shortcut registration
        - Selective interception
        - Event replacement
        - TypeScript or Node.js binding
        - Python binding
        - Documentation, testing, or repository tooling
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platforms
      multiple: true
      options:
        - Windows
        - macOS
        - Linux X11
        - Linux Wayland
        - Platform independent
        - Unknown
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Include workarounds, prior art, and why they are insufficient.
    validations:
      required: false

  - type: textarea
    id: semantics
    attributes:
      label: Behavior and edge cases
      description: Cover down/up pairing, modifiers, key repeat, focus, permissions, conflicts, recovery, and unsupported states.
    validations:
      required: true

  - type: textarea
    id: security_privacy
    attributes:
      label: Security and privacy impact
      description: Explain privileges, captured data, logging, IPC, persistence, and failure behavior.
    validations:
      required: true

  - type: textarea
    id: contribution
    attributes:
      label: Contribution
      description: State whether you can provide research, a prototype, tests, documentation, or review.
    validations:
      required: false
